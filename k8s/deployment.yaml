apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflow
  labels:
    app: netflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflow
  template:
    metadata:
      labels:
        app: netflow
    spec:
      containers:
        - name: netflow
          image: ajaysharma111/netflow:latest
          ports:
            - containerPort: 80
